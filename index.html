<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="form-panel" aria-labelledby="page-title">
      <h1 id="page-title">Sistema de registro de estudiantes</h1>

      <form id="student-form" class="student-form" novalidate>
        <div class="field">
          <label for="full-name">Nombre completo</label>
          <input type="text" id="full-name" name="fullName" placeholder="Ej: Laura Martinez" required>
        </div>

        <div class="field">
          <label for="id-number">Número de cédula</label>
          <input type="text" id="id-number" name="idNumber" placeholder="Ej: 1020304050" required>
        </div>

        <div class="field">
          <label for="city">Ciudad de residencia</label>
          <input type="text" id="city" name="city" placeholder="Ej: Bogota" required>
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Ej: estudiante@correo.com" required>
        </div>

        <button type="submit">Registrar</button>
        <button type="button" id="cancel-edit-button" class="cancel-button" hidden>Cancelar edición</button>
      </form>

      <p id="message" class="message" role="status"></p>
      <div id="import-summary" class="import-summary" aria-live="polite" hidden></div>

      <div class="search-field">
        <label for="student-search">Buscar estudiante</label>
        <input type="search" id="student-search" placeholder="Buscar por nombre, cedula, ciudad o correo">
      </div>

      <div class="table-actions">
        <label for="import-csv-input" class="import-csv-button">Importar CSV</label>
        <input type="file" id="import-csv-input" accept=".csv,text/csv" hidden>
        <button type="button" id="export-csv-button">Exportar CSV</button>
      </div>

      <div class="table-container">
        <table>
          <caption>Estudiantes registrados</caption>
          <thead>
            <tr>
              <th>
                <button type="button" class="sort-button" data-sort-key="fullName">Nombre completo <span class="sort-indicator" aria-hidden="true"></span></button>
              </th>
              <th>
                <button type="button" class="sort-button" data-sort-key="idNumber">Número de cédula <span class="sort-indicator" aria-hidden="true"></span></button>
              </th>
              <th>
                <button type="button" class="sort-button" data-sort-key="city">Ciudad de residencia <span class="sort-indicator" aria-hidden="true"></span></button>
              </th>
              <th>
                <button type="button" class="sort-button" data-sort-key="email">Correo electrónico <span class="sort-indicator" aria-hidden="true"></span></button>
              </th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="students-table-body"></tbody>
        </table>
      </div>

      <div class="pagination" aria-label="Paginación de estudiantes">
        <button type="button" id="previous-page-button">Anterior</button>
        <span id="page-info">Página 1 de 1</span>
        <button type="button" id="next-page-button">Siguiente</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
